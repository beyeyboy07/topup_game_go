          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Mengambil semua game
      tags:
      - games
    post:
      consumes:
      - application/json
      description: Membuat game baru.
      parameters:
      - description: Data game
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.GameRequest'
