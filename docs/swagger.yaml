basePath: /
definitions:
  controllers.GameRequest:
    properties:
      code:
        example: ML
        type: string
      name:
        example: Mobile Legends
        type: string
    type: object
  controllers.LoginRequest:
    properties:
      email:
        example: budi@example.com
        type: string
      password:
        example: password123
        type: string
    type: object
  controllers.OrderRequest:
    properties:
      player_id:
        example: "123456789"
        type: string
      product_id:
        example: 1
        type: integer
      server_id:
        example: "1234"
        type: string
    type: object
  controllers.OrderStatusRequest:
    properties:
      status:
        example: PROCESSING
        type: string
    type: object
  controllers.ProductRequest:
    properties:
      buy_price:
        example: 10000
        type: integer
      code:
        example: ML86
        type: string
      game_id:
        example: 1
        type: integer
      name:
        example: 86 Diamonds
        type: string
      sell_price:
        example: 12000
        type: integer
    type: object
  controllers.ProviderRequest:
    properties:
      api_key:
        example: secret-key
        type: string
      base_url:
        example: https://api.example.com
        type: string
      code:
        example: DIGIFLAZZ
        type: string
      name:
        example: Digiflazz
        type: string
      status:
        example: true
        type: boolean
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        example: budi@example.com
        type: string
      name:
        example: Budi
        type: string
      password:
        example: password123
        type: string
    type: object
  utils.APIResponse:
    properties:
      data:
        description: Data yang dikirim API.
      message:
        description: Message dari API.
        type: string
      status:
        description: |-
          Status response.
          Contoh: success / error
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: REST API untuk mengelola game, product, provider, dan order top-up.
  title: Topup Games API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Menghasilkan access token untuk request terproteksi.
      parameters:
      - description: Data login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Login user
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Membuat akun customer baru.
      parameters:
      - description: Data registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Mendaftarkan user
      tags:
      - auth
  /api/games:
